services:
  db:
    image: postgres:16-alpine
    container_name: task_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_management_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "Task Management REST API"
      API_V1_STR: "/api/v1"
      ENVIRONMENT: "production"
      DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@db:5432/taskdb"
      JWT_SECRET_KEY: "prod-super-secure-key-replace-with-secrets-manager-in-cloud"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
    driver: local
